<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ragnar — vali mäng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: hsl(345, 72%, 58%);
      --accent-dim: hsla(345, 72%, 58%, 0.22);
      --bg: #0a0c12;
      --text: #e8eeff;
      --muted: rgba(232, 238, 255, 0.62);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rajdhani", system-ui, sans-serif;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, var(--accent-dim), transparent),
        var(--bg);
      line-height: 1.45;
    }
    .shell {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }
    .back {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 500;
    }
    .back:hover { color: var(--accent); }
    header { margin-bottom: 32px; }
    .eyebrow {
      margin: 0 0 8px;
      font-size: 0.85rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
    }
    .lead { margin: 0; color: var(--muted); max-width: 36em; }
    .grid {
      display: grid;
      gap: 16px;
    }
    @media (min-width: 520px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }
    .game-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 22px 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .game-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--accent-dim);
    }
    .game-card .icon { font-size: 2.25rem; line-height: 1; }
    .game-card h2 {
      margin: 0;
      font-size: 1.35rem;
      color: var(--text);
    }
    .game-card p {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      flex: 1;
    }
    .game-card .cta {
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="shell">
    <a class="back" href="../../index.html">← Mängude terminal</a>
    <header>
      <p class="eyebrow">PLAYER 23</p>
      <h1>Ragnar</h1>
      <p class="lead">Vali, mida mängida — võidusõit või laevatekk.</p>
    </header>
    <div class="grid" role="list">
      <a class="game-card" href="hobune/" role="listitem">
        <span class="icon" aria-hidden="true">🐎</span>
        <h2>Hobune</h2>
        <p>Staadionikujuline võidusõit: vali hobune, pane panus ja jälgi ringi finišini.</p>
        <span class="cta">Ava mäng →</span>
      </a>
      <a class="game-card" href="rust/" role="listitem">
        <span class="icon" aria-hidden="true">⚓</span>
        <h2>Rust</h2>
        <p>DECKFIGHT — Cargo-01: esimeses isikus laev, relvad ja treningumaalikutega lahing.</p>
        <span class="cta">Ava mäng →</span>
      </a>
    </div>
  </div>
</body>
</html>
